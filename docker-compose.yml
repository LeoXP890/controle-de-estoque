services:
  mysql:
    image: mysql:8.4
    container_name: controle-estoque-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: controle_estoque
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
